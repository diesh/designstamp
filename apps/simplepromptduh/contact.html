<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — simple PROMPT DUH</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 24px; color: #999; font-size: 14px; }
  input, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #1a1a1a;
    color: #fff;
    font-size: 15px;
    margin-bottom: 12px;
    font-family: inherit;
  }
  textarea { min-height: 100px; resize: vertical; }
  button {
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: #4a8dff;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #3a7bee; }
  .back-link {
    display: inline-block;
    margin-top: 20px;
    font-size: 13px;
    color: #666;
    text-decoration: none;
  }
  .back-link:hover { color: #999; }
</style>
</head>
<body>
  <div class="card">
    <h1>Get in touch</h1>
    <p>Questions, bugs, or ideas, send them here.</p>
    <form action="https://formspree.io/f/mwpvbdbr" method="POST">
      <input type="email" name="email" placeholder="Your email (so I can reply)" required />
      <textarea name="message" placeholder="Your message" required></textarea>
      <button type="submit">Send</button>
    </form>
    <a href="index.html" class="back-link">&larr; Back to the teleprompter</a>
  </div>
</body>
</html>
